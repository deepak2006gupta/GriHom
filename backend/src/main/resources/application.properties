server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/grihom}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:change_this_to_a_very_long_random_secret_at_least_32_chars}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.seed.admin.email=${DEFAULT_ADMIN_EMAIL:admin@homevalue.com}
app.seed.admin.password=${DEFAULT_ADMIN_PASSWORD:admin}

captcha.recaptcha.enabled=${RECAPTCHA_ENABLED:true}
captcha.recaptcha.secret=${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
captcha.recaptcha.verify-url=${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
